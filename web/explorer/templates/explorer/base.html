<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}🌸 DMI / SMBIOS Hardware Explorer{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #FDF1F5;
      --surface:     #FFFFFF;
      --surface2:    #FFF8FA;
      --border:      #F5C0CE;
      --border-soft: #FADADD;
      --accent:      #C9566B;
      --accent2:     #E8849A;
      --cherry:      #3D0C11;
      --cherry2:     #5C1A2E;
      --text:        #2D1820;
      --text2:       #5C3040;
      --muted:       #9B7280;
      --danger:      #A83250;
      --serif:       'Noto Serif JP', Georgia, serif;
      --sans:        'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: var(--sans);
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text);
      background: linear-gradient(150deg, #FFF5F8 0%, #FDE8F0 55%, #FDF1F5 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* ── navbar ── */
    .navbar-custom {
      background: linear-gradient(135deg, var(--cherry) 0%, var(--cherry2) 100%);
      border-bottom: 2px solid var(--accent2);
      padding: .85rem 1.75rem;
      box-shadow: 0 2px 20px rgba(61,12,17,.4);
    }
    .nav-brand-title {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 700;
      color: #FFE0E8;
      letter-spacing: .03em;
      line-height: 1.2;
      display: block;
    }
    .nav-brand-sub {
      font-family: var(--sans);
      font-size: .66rem;
      color: rgba(255,183,197,.6);
      letter-spacing: .14em;
      text-transform: uppercase;
      display: block;
    }
    .nav-page-links { display: flex; gap: .25rem; }
    .nav-page-link {
      font-family: var(--sans);
      font-size: .8rem;
      color: rgba(255,183,197,.7);
      text-decoration: none;
      padding: .3rem .7rem;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all .15s;
      white-space: nowrap;
    }
    .nav-page-link:hover { color: #FFD6E0; background: rgba(255,183,197,.1); }
    .nav-page-link.active { color: #FFE0E8; border-color: rgba(255,183,197,.25); background: rgba(255,183,197,.12); font-weight: 500; }
    .nav-page-link i { margin-right: .3rem; }

    .badge-authors {
      font-family: var(--sans);
      font-size: .7rem;
      background: rgba(255,214,224,.09);
      color: #FFB7C5;
      border: 1px solid rgba(255,183,197,.2);
      border-radius: 999px;
      padding: .28rem .85rem;
      white-space: nowrap;
    }
    .badge-source { font-family: var(--sans); font-size: .7rem; border-radius: 999px; padding: .28rem .85rem; font-weight: 600; }
    .badge-wmi    { background: rgba(232,132,154,.18); color: #E8849A; border: 1px solid rgba(232,132,154,.35); }
    .badge-smbios { background: rgba(201,86,107,.18);  color: #C9566B; border: 1px solid rgba(201,86,107,.4);  }

    /* ── page wrap ── */
    .page-wrap { max-width: 1380px; margin: 0 auto; padding: 1.75rem 1.5rem 3rem; }

    /* ── sidebar ── */
    .sidebar { position: sticky; top: 1.5rem; }
    .sidebar-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: .85rem .5rem;
      box-shadow: 0 2px 16px rgba(201,86,107,.07);
    }
    .sidebar-heading {
      font-family: var(--serif);
      font-size: .67rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--muted);
      padding: .1rem .8rem .65rem;
    }
    .nav-pills .nav-link {
      font-family: var(--sans);
      font-size: .855rem;
      color: var(--muted);
      border-radius: 10px;
      padding: .48rem .8rem;
      margin-bottom: .12rem;
      transition: background .14s, color .14s, box-shadow .14s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-pills .nav-link:hover { color: var(--accent); background: rgba(201,86,107,.07); }
    .nav-pills .nav-link.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
      color: #fff !important;
      font-weight: 500;
      box-shadow: 0 3px 12px rgba(201,86,107,.3);
    }
    .nav-pills .nav-link i { margin-right: .4rem; font-size: .88rem; vertical-align: -.05em; }

    /* ── section cards ── */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-top: 3px solid var(--accent2);
      border-radius: 14px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      scroll-margin-top: 1.75rem;
      box-shadow: 0 4px 24px rgba(201,86,107,.07), 0 1px 4px rgba(201,86,107,.05);
      transition: box-shadow .2s, transform .2s;
    }
    .section-card:hover {
      box-shadow: 0 8px 36px rgba(201,86,107,.13), 0 2px 8px rgba(201,86,107,.07);
      transform: translateY(-1px);
    }
    .section-card-header {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .9rem 1.4rem;
      background: linear-gradient(90deg, rgba(232,132,154,.09) 0%, rgba(249,196,208,.04) 55%, transparent 100%);
      border-bottom: 1px solid var(--border-soft);
      min-width: 0;
    }
    .card-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(201,86,107,.12), rgba(232,132,154,.2));
      border: 1px solid rgba(232,132,154,.28);
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon i { font-size: 1rem; color: var(--accent); }
    .section-card-header h5 {
      margin: 0;
      font-family: var(--serif);
      font-size: .95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .01em;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── kv table ── */
    .kv-table { width: 100%; border-collapse: collapse; }
    .kv-table tr { border-bottom: 1px solid rgba(245,192,206,.38); }
    .kv-table tr:last-child { border-bottom: none; }
    .kv-table tbody tr:nth-child(even) td { background: rgba(253,241,245,.55); }
    .kv-table tr:hover td { background: rgba(232,132,154,.07) !important; }
    .kv-table td { padding: .6rem 1.4rem; vertical-align: top; }
    .kv-key { width: 36%; font-family: var(--sans); font-size: .825rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
    .kv-val { font-family: var(--sans); font-size: .875rem; font-weight: 500; color: var(--text); }
    .kv-val .empty { color: var(--muted); font-style: italic; font-weight: 400; }
    .kv-sub td { font-family: var(--serif); font-size: .82rem; font-weight: 600; color: var(--accent); letter-spacing: .01em; padding-top: .9rem; padding-bottom: .25rem; }

    /* ── error card ── */
    .error-card {
      background: #FFF8FA;
      border: 1px solid rgba(201,86,107,.18);
      border-top: 3px solid var(--danger);
      border-radius: 14px; padding: 2rem;
      box-shadow: 0 4px 24px rgba(168,50,80,.07);
    }
    .error-card h4 { font-family: var(--serif); font-size: 1.1rem; font-weight: 600; color: var(--danger); }
    .error-pre { background: #FFF0F4; border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; font-size: .82rem; color: var(--danger); font-family: 'Consolas', monospace; white-space: pre-wrap; line-height: 1.75; }
    .fix-heading { font-family: var(--serif); font-size: .9rem; font-weight: 600; color: var(--text2); margin: 1.25rem 0 .6rem; }
    .fix-step { background: var(--surface2); border: 1px solid var(--border-soft); border-left: 3px solid var(--accent2); border-radius: 0 10px 10px 0; padding: .75rem 1.1rem; margin-bottom: .55rem; font-size: .875rem; }
    .fix-step strong { color: var(--text2); }
    .fix-step code { font-family: 'Consolas', monospace; font-size: .8rem; background: rgba(201,86,107,.09); color: var(--accent); border-radius: 4px; padding: .1rem .4rem; }
    .error-path { font-size: .78rem; color: var(--muted); margin-top: 1rem; margin-bottom: 0; }
    .error-path code { font-family: 'Consolas', monospace; color: var(--muted); }

    /* ── status dot ── */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: .4rem; }
    .dot-err { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    /* ── petals ── */
    #petal-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
    .petal-wrap { position: absolute; top: -40px; animation: petal-fall linear infinite; will-change: transform, opacity; }
    .petal-inner { border-radius: 80% 0 55% 50% / 55% 0 80% 50%; animation: petal-sway ease-in-out infinite alternate; }
    @keyframes petal-fall {
      0%   { transform: translateY(0)     rotate(var(--r0)); opacity: 0;   }
      6%   {                                                  opacity: .88; }
      86%  {                                                  opacity: .6;  }
      100% { transform: translateY(110vh) rotate(var(--r1)); opacity: 0;   }
    }
    @keyframes petal-sway {
      from { transform: translateX(calc(var(--drift) * -1)) rotate(-12deg); }
      to   { transform: translateX(var(--drift))             rotate( 12deg); }
    }

    {% block extra_css %}{% endblock %}

    @media (max-width: 767px) {
      .sidebar { display: none; }
      .page-wrap { padding: 1rem .75rem 2rem; }
      .navbar-custom { padding: .75rem 1rem; }
      .badge-authors { display: none; }
    }
  </style>
</head>
<body>

<div id="petal-layer"></div>

<nav class="navbar navbar-custom">
  <div class="d-flex align-items-center gap-3">
    <a href="{% url 'index' %}" style="text-decoration:none;">
      <span class="nav-brand-title">🌸 DMI / SMBIOS Hardware Explorer</span>
      <span class="nav-brand-sub">Operating Systems Project</span>
    </a>
    <div class="nav-page-links">
      <a href="{% url 'index' %}" class="nav-page-link {% block nav_home %}{% endblock %}">
        <i class="bi bi-display"></i>Hardware
      </a>
      <a href="{% url 'about' %}" class="nav-page-link {% block nav_about %}{% endblock %}">
        <i class="bi bi-info-circle"></i>About
      </a>
    </div>
  </div>
  <div class="d-flex align-items-center gap-2 flex-wrap">
    {% block navbar_badges %}{% endblock %}
    <span class="badge-authors">SAHIN Leyla-Kubra &amp; BOINEGRI Stefania-Denisa</span>
  </div>
</nav>

<div class="page-wrap">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  /* scroll spy — only runs when sidebar nav exists */
  const sectionNav = document.getElementById('sectionNav');
  if (sectionNav) {
    const links = sectionNav.querySelectorAll('.nav-link[href^="#"]');
    const cards = [...links].map(l => document.querySelector(l.getAttribute('href')));
    function setActive() {
      let active = 0;
      cards.forEach((c, i) => { if (c && c.getBoundingClientRect().top <= 90) active = i; });
      links.forEach((l, i) => l.classList.toggle('active', i === active));
    }
    window.addEventListener('scroll', setActive, { passive: true });
    links.forEach(l => l.addEventListener('click', e => {
      e.preventDefault();
      document.querySelector(l.getAttribute('href'))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }
</script>
<script>
  /* falling sakura petals */
  (function () {
    const layer = document.getElementById('petal-layer');
    const COLORS = [
      ['#FFB7C5','#F490A8'],['#FFC8D3','#F9A8BA'],['#FFD6E0','#F9C0CE'],
      ['#FADADD','#F5B8C8'],['#F4A7B9','#E8849A'],['#FFE4EB','#F9C4D0'],
    ];
    const rand = (a, b) => a + Math.random() * (b - a);
    for (let i = 0; i < 32; i++) {
      const wrap = document.createElement('div');
      const inner = document.createElement('div');
      wrap.className = 'petal-wrap'; inner.className = 'petal-inner';
      const size = rand(9, 20);
      const [c1, c2] = COLORS[Math.floor(Math.random() * COLORS.length)];
      const dur = rand(9, 20), delay = rand(-dur, 1), drift = rand(18, 48);
      const r0 = rand(0, 360), r1 = r0 + rand(240, 600);
      wrap.style.cssText = `left:${rand(-2,102)}%;animation-duration:${dur}s;animation-delay:${delay}s;--r0:${r0}deg;--r1:${r1}deg;`;
      inner.style.cssText = `width:${size}px;height:${size*1.4}px;background:linear-gradient(135deg,${c1},${c2});box-shadow:inset -2px -2px 5px rgba(180,60,90,.18);animation-duration:${rand(1.8,4.2)}s;--drift:${drift}px;`;
      wrap.appendChild(inner); layer.appendChild(wrap);
      wrap.addEventListener('animationiteration', () => { wrap.style.left = rand(-2, 102) + '%'; });
    }
  })();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
